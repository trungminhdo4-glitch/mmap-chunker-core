[package]
name = "mmap-chunker-core"
version = "0.2.2"
edition = "2021"
rust-version = "1.77"
description = "Record-aligned byte-range planning for large immutable files with zero-copy mmap framing, CLI, and a stable C ABI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/trungminhdo4-glitch/mmap-chunker-core"
homepage = "https://github.com/trungminhdo4-glitch/mmap-chunker-core#readme"
documentation = "https://docs.rs/mmap-chunker-core"
readme = "README.md"
keywords = ["mmap", "jsonl", "ndjson", "byte-ranges", "ffi"]
categories = ["filesystem", "memory-management", "development-tools::ffi", "command-line-utilities"]
exclude = ["/native_io/", "/tests/test_native_io.py", "/tests/python_parity.py", "/AGENTS.md", "/AGENT_LOG.md"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mmap-chunker-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/mmap-chunker-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lib]
name = "mmap_chunker_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]

[dev-dependencies]
memchr = "2"
