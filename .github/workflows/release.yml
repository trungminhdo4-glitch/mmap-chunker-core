name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$CARGO_VERSION" ]; then
            echo "ERROR: could not read package version from Cargo.toml"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: release push must target a semantic-version tag"
              exit 1
            fi
            TAG_VERSION="${REF_NAME#v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "ERROR: tag v$TAG_VERSION != Cargo.toml version $CARGO_VERSION"
              exit 1
            fi
            VERSION="$TAG_VERSION"
            echo "Tag mode: v$VERSION will publish a draft release"
          else
            VERSION="$CARGO_VERSION"
            echo "Dry-run mode: workflow_dispatch will build v$VERSION and upload Actions artifacts only"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            cross: true
          - os: macos-13
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        if: ${{ !matrix.cross }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cross CLI
        if: ${{ matrix.cross }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross, aarch64-linux)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Package, verify, and consume archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          ARCHIVE="mmap-chunker-core-${RELEASE_VERSION}-${{ matrix.target }}"
          STAGING="staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/include" "$STAGING/lib"
          cp mmap_chunker.h "$STAGING/include/"
          cp LICENSE-MIT LICENSE-APACHE "$STAGING/"

          TARGET_DIR="target/${{ matrix.target }}/release"
          case "${{ runner.os }}" in
            Windows)
              for lib in mmap_chunker_core.dll mmap_chunker_core.dll.lib mmap_chunker_core.lib; do
                if [ -f "$TARGET_DIR/$lib" ]; then
                  cp "$TARGET_DIR/$lib" "$STAGING/lib/"
                else
                  echo "ERROR: expected artifact $TARGET_DIR/$lib not found"
                  ls -la "$TARGET_DIR/" || true
                  exit 1
                fi
              done
              7z a -tzip -mx=9 "${ARCHIVE}.zip" "$STAGING" >/dev/null
              sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
              CHECKSUM_FILE="${ARCHIVE}.zip.sha256"
              PACKAGE="${ARCHIVE}.zip"
              ;;
            macOS)
              for lib in libmmap_chunker_core.dylib libmmap_chunker_core.a; do
                if [ ! -f "$TARGET_DIR/$lib" ]; then
                  echo "ERROR: expected artifact $TARGET_DIR/$lib not found"
                  ls -la "$TARGET_DIR/" || true
                  exit 1
                fi
              done
              cp "$TARGET_DIR/libmmap_chunker_core.dylib" "$STAGING/lib/"
              cp "$TARGET_DIR/libmmap_chunker_core.a" "$STAGING/lib/"
              tar czf "${ARCHIVE}.tar.gz" "$STAGING"
              shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
              CHECKSUM_FILE="${ARCHIVE}.tar.gz.sha256"
              PACKAGE="${ARCHIVE}.tar.gz"
              ;;
            Linux)
              for lib in libmmap_chunker_core.so libmmap_chunker_core.a; do
                if [ ! -f "$TARGET_DIR/$lib" ]; then
                  echo "ERROR: expected artifact $TARGET_DIR/$lib not found"
                  ls -la "$TARGET_DIR/" || true
                  exit 1
                fi
              done
              cp "$TARGET_DIR/libmmap_chunker_core.so" "$STAGING/lib/"
              cp "$TARGET_DIR/libmmap_chunker_core.a" "$STAGING/lib/"
              tar czf "${ARCHIVE}.tar.gz" "$STAGING"
              sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
              CHECKSUM_FILE="${ARCHIVE}.tar.gz.sha256"
              PACKAGE="${ARCHIVE}.tar.gz"
              ;;
          esac

          echo "=== Checksum verification ==="
          case "${{ runner.os }}" in
            macOS) shasum -a 256 -c "$CHECKSUM_FILE" ;;
            *) sha256sum -c "$CHECKSUM_FILE" ;;
          esac

          echo "=== Fresh archive extraction ==="
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          mkdir "$VERIFY_ROOT/extracted"
          case "${{ runner.os }}" in
            Windows) 7z x -y "$PACKAGE" "-o$VERIFY_ROOT/extracted" >/dev/null ;;
            *) tar xzf "$PACKAGE" -C "$VERIFY_ROOT/extracted" ;;
          esac

          ARCHIVE_ROOT="$VERIFY_ROOT/extracted/staging"
          test -f "$ARCHIVE_ROOT/include/mmap_chunker.h"
          test -f "$ARCHIVE_ROOT/LICENSE-MIT"
          test -f "$ARCHIVE_ROOT/LICENSE-APACHE"
          case "${{ runner.os }}" in
            Windows)
              test -f "$ARCHIVE_ROOT/lib/mmap_chunker_core.dll"
              test -f "$ARCHIVE_ROOT/lib/mmap_chunker_core.dll.lib"
              test -f "$ARCHIVE_ROOT/lib/mmap_chunker_core.lib"
              DYNAMIC="$ARCHIVE_ROOT/lib/mmap_chunker_core.dll"
              ;;
            macOS)
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.dylib"
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.a"
              DYNAMIC="$ARCHIVE_ROOT/lib/libmmap_chunker_core.dylib"
              ;;
            Linux)
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.so"
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.a"
              DYNAMIC="$ARCHIVE_ROOT/lib/libmmap_chunker_core.so"
              ;;
          esac

          echo "=== Dynamic ABI symbol verification ==="
          grep -vE '^[[:space:]]*(#|$)' abi/v1.symbols | sort > "$VERIFY_ROOT/expected.symbols"
          case "${{ runner.os }}" in
            Linux)
              nm -D --defined-only "$DYNAMIC" \
                | awk '$3 ~ /^mmap_engine_/ {print $3}' | sort > "$VERIFY_ROOT/actual.symbols"
              ;;
            macOS)
              nm -gU "$DYNAMIC" \
                | awk '$3 ~ /^_?mmap_engine_/ {sub(/^_/, "", $3); print $3}' \
                | sort > "$VERIFY_ROOT/actual.symbols"
              ;;
            Windows)
              if command -v llvm-readobj.exe >/dev/null 2>&1; then
                llvm-readobj.exe --coff-exports "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v llvm-readobj >/dev/null 2>&1; then
                llvm-readobj --coff-exports "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v dumpbin.exe >/dev/null 2>&1; then
                dumpbin.exe /exports "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v llvm-nm.exe >/dev/null 2>&1; then
                llvm-nm.exe --defined-only "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v llvm-nm >/dev/null 2>&1; then
                llvm-nm --defined-only "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              else
                echo "ERROR: no PE export inspection tool (llvm-readobj.exe, dumpbin.exe, or llvm-nm.exe)"
                exit 1
              fi
              ;;
          esac
          diff -u "$VERIFY_ROOT/expected.symbols" "$VERIFY_ROOT/actual.symbols"

          if [ "${{ matrix.cross || false }}" = "true" ]; then
            echo "SKIP: native C and ctypes runtime checks for cross-compiled aarch64 artifact"
          else
            echo "=== C consumer from extracted archive ==="
            CONSUMER="$VERIFY_ROOT/c_consumer.c"
            sed 's|#include "../mmap_chunker.h"|#include "mmap_chunker.h"|' \
              examples/c_consumer.c > "$CONSUMER"
            test -s "$CONSUMER"
            case "${{ runner.os }}" in
              Windows)
                cc -I"$ARCHIVE_ROOT/include" -o "$VERIFY_ROOT/c_consumer.exe" \
                  "$CONSUMER" "$ARCHIVE_ROOT/lib/mmap_chunker_core.dll.lib"
                (cd "$VERIFY_ROOT" && ./c_consumer.exe)
                ;;
              macOS)
                cc -I"$ARCHIVE_ROOT/include" -L"$ARCHIVE_ROOT/lib" \
                  -Wl,-rpath,"$ARCHIVE_ROOT/lib" -o "$VERIFY_ROOT/c_consumer" \
                  "$CONSUMER" -lmmap_chunker_core -lpthread
                (cd "$VERIFY_ROOT" && ./c_consumer)
                ;;
              Linux)
                cc -I"$ARCHIVE_ROOT/include" -L"$ARCHIVE_ROOT/lib" \
                  -Wl,-rpath,"$ARCHIVE_ROOT/lib" -o "$VERIFY_ROOT/c_consumer" \
                  "$CONSUMER" -lmmap_chunker_core -lpthread -ldl
                (cd "$VERIFY_ROOT" && ./c_consumer)
                ;;
            esac

            echo "=== Python ctypes from extracted dynamic library ==="
            if command -v python >/dev/null 2>&1; then
              PY_DYNAMIC="$DYNAMIC"
              if [ "${{ runner.os }}" = "Windows" ]; then
                PY_DYNAMIC="$(cygpath -w "$DYNAMIC")"
              fi
              python - "$PY_DYNAMIC" <<'PY'
          import ctypes
          import os
          import sys

          path = sys.argv[1]
          if os.name == "nt":
              os.add_dll_directory(os.path.dirname(os.path.abspath(path)))
          lib = ctypes.CDLL(path)
          lib.mmap_engine_abi_version.restype = ctypes.c_uint32
          lib.mmap_engine_capabilities.restype = ctypes.c_uint32
          assert lib.mmap_engine_abi_version() == 0x00010002
          assert lib.mmap_engine_capabilities() & 0x1
          print("PASS: ctypes loaded extracted dynamic library")
          PY
            else
              echo "SKIP: python is not installed on this runner"
            fi
          fi

          echo "=== Archive contents ==="
          case "${{ runner.os }}" in
            Windows) 7z l "$PACKAGE" ;;
            *) tar tzf "$PACKAGE" ;;
          esac
          if [ "${{ matrix.cross || false }}" = "true" ]; then
            echo "PASS: $PACKAGE has verified checksum, contents, ABI, and package-only cross coverage"
          else
            echo "PASS: $PACKAGE has verified checksum, contents, ABI, C, and ctypes coverage"
          fi

      - name: Upload verified artifact for release or dry run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            mmap-chunker-core-*.tar.gz
            mmap-chunker-core-*.zip
            mmap-chunker-core-*.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: ${{ github.event_name == 'push' }}
    needs: [prepare, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assert release artifact set is present
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 10

      - name: Create draft release and upload artifacts
        uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          draft: true
          name: "v${{ needs.prepare.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## mmap-chunker-core v${{ needs.prepare.outputs.version }}

            Prebuilt native libraries for C, Python, Go, and other FFI consumers.

            Each archive contains the C header, dynamic library, static library, and licenses.
            Every archive has an accompanying `.sha256` checksum file.
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
