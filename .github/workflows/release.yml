name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GLIBC_217_RUNTIME_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:41269ff9c2edb74de6fe65eb8c9db2b5e03370ce7f3da313aa7e3134c9371892

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$CARGO_VERSION" ]; then
            echo "ERROR: could not read package version from Cargo.toml"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: release push must target a semantic-version tag"
              exit 1
            fi
            TAG_VERSION="${REF_NAME#v}"
            if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
              echo "ERROR: tag v$TAG_VERSION != Cargo.toml version $CARGO_VERSION"
              exit 1
            fi
            VERSION="$TAG_VERSION"
            echo "Tag mode: v$VERSION will publish after environment approval"
          else
            VERSION="$CARGO_VERSION"
            echo "Dry-run mode: workflow_dispatch will build v$VERSION and upload Actions artifacts only"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        if: ${{ !matrix.cross }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cross CLI
        if: ${{ matrix.cross }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Package, verify, and consume archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          ARCHIVE="mmap-chunker-core-${RELEASE_VERSION}-${{ matrix.target }}"
          STAGING="staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/include" "$STAGING/lib"
          cp mmap_chunker.h "$STAGING/include/"
          cp LICENSE-MIT LICENSE-APACHE "$STAGING/"

          TARGET_DIR="target/${{ matrix.target }}/release"
          case "${{ runner.os }}" in
            Windows)
              for lib in mmap_chunker_core.dll mmap_chunker_core.dll.lib mmap_chunker_core.lib; do
                if [ -f "$TARGET_DIR/$lib" ]; then
                  cp "$TARGET_DIR/$lib" "$STAGING/lib/"
                else
                  echo "ERROR: expected artifact $TARGET_DIR/$lib not found"
                  ls -la "$TARGET_DIR/" || true
                  exit 1
                fi
              done
              7z a -tzip -mx=9 "${ARCHIVE}.zip" "$STAGING" >/dev/null
              sha256sum "${ARCHIVE}.zip" > "${ARCHIVE}.zip.sha256"
              CHECKSUM_FILE="${ARCHIVE}.zip.sha256"
              PACKAGE="${ARCHIVE}.zip"
              ;;
            macOS)
              for lib in libmmap_chunker_core.dylib libmmap_chunker_core.a; do
                if [ ! -f "$TARGET_DIR/$lib" ]; then
                  echo "ERROR: expected artifact $TARGET_DIR/$lib not found"
                  ls -la "$TARGET_DIR/" || true
                  exit 1
                fi
              done
              cp "$TARGET_DIR/libmmap_chunker_core.dylib" "$STAGING/lib/"
              cp "$TARGET_DIR/libmmap_chunker_core.a" "$STAGING/lib/"
              tar czf "${ARCHIVE}.tar.gz" "$STAGING"
              shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
              CHECKSUM_FILE="${ARCHIVE}.tar.gz.sha256"
              PACKAGE="${ARCHIVE}.tar.gz"
              ;;
            Linux)
              for lib in libmmap_chunker_core.so libmmap_chunker_core.a; do
                if [ ! -f "$TARGET_DIR/$lib" ]; then
                  echo "ERROR: expected artifact $TARGET_DIR/$lib not found"
                  ls -la "$TARGET_DIR/" || true
                  exit 1
                fi
              done
              cp "$TARGET_DIR/libmmap_chunker_core.so" "$STAGING/lib/"
              cp "$TARGET_DIR/libmmap_chunker_core.a" "$STAGING/lib/"
              tar czf "${ARCHIVE}.tar.gz" "$STAGING"
              sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
              CHECKSUM_FILE="${ARCHIVE}.tar.gz.sha256"
              PACKAGE="${ARCHIVE}.tar.gz"
              ;;
          esac

          echo "=== Checksum verification ==="
          case "${{ runner.os }}" in
            macOS) shasum -a 256 -c "$CHECKSUM_FILE" ;;
            *) sha256sum -c "$CHECKSUM_FILE" ;;
          esac

          echo "=== Fresh archive extraction ==="
          VERIFY_ROOT="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_ROOT"' EXIT
          mkdir "$VERIFY_ROOT/extracted"
          case "${{ runner.os }}" in
            Windows) 7z x -y "$PACKAGE" "-o$VERIFY_ROOT/extracted" >/dev/null ;;
            *) tar xzf "$PACKAGE" -C "$VERIFY_ROOT/extracted" ;;
          esac

          ARCHIVE_ROOT="$VERIFY_ROOT/extracted/staging"
          test -f "$ARCHIVE_ROOT/include/mmap_chunker.h"
          test -f "$ARCHIVE_ROOT/LICENSE-MIT"
          test -f "$ARCHIVE_ROOT/LICENSE-APACHE"
          case "${{ runner.os }}" in
            Windows)
              test -f "$ARCHIVE_ROOT/lib/mmap_chunker_core.dll"
              test -f "$ARCHIVE_ROOT/lib/mmap_chunker_core.dll.lib"
              test -f "$ARCHIVE_ROOT/lib/mmap_chunker_core.lib"
              DYNAMIC="$ARCHIVE_ROOT/lib/mmap_chunker_core.dll"
              ;;
            macOS)
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.dylib"
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.a"
              DYNAMIC="$ARCHIVE_ROOT/lib/libmmap_chunker_core.dylib"
              ;;
            Linux)
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.so"
              test -f "$ARCHIVE_ROOT/lib/libmmap_chunker_core.a"
              DYNAMIC="$ARCHIVE_ROOT/lib/libmmap_chunker_core.so"
              ;;
          esac

          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            LINUX_GLIBC_MAX="2.17"
            echo "=== Packaged GLIBC symbol ceiling (declared $LINUX_GLIBC_MAX) ==="
            GLIBC_VERSIONS=$(readelf --version-info "$DYNAMIC" \
              | grep -oE 'GLIBC_[0-9.]+' | sort -Vu)
            printf '%s\n' "$GLIBC_VERSIONS"
            MAX_GLIBC=$(printf '%s\n' "$GLIBC_VERSIONS" | sort -V | tail -n 1)
            if [ -z "$MAX_GLIBC" ]; then
              echo "ERROR: packaged Linux shared library has no GLIBC version inventory"
              exit 1
            fi
            if ! awk -v found="$MAX_GLIBC" -v declared="GLIBC_$LINUX_GLIBC_MAX" '
              BEGIN {
                sub(/^GLIBC_/, "", found)
                sub(/^GLIBC_/, "", declared)
                split(found, f, ".")
                split(declared, d, ".")
                exit !(f[1] < d[1] || (f[1] == d[1] && f[2] <= d[2]))
              }
            '; then
              echo "ERROR: packaged Linux shared library requires $MAX_GLIBC, above GLIBC_$LINUX_GLIBC_MAX"
              exit 1
            fi
            echo "PASS: packaged Linux shared library is at or below GLIBC_$LINUX_GLIBC_MAX"

            echo "=== Packaged GLIBC 2.17 runtime conformance ==="
            echo "runtime_image=$GLIBC_217_RUNTIME_IMAGE"
            docker pull "$GLIBC_217_RUNTIME_IMAGE"
            docker image inspect "$GLIBC_217_RUNTIME_IMAGE" \
              --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}'
            docker run --rm \
              -v "$VERIFY_ROOT:/verify:ro" \
              -v "$GITHUB_WORKSPACE:/source:ro" \
              "$GLIBC_217_RUNTIME_IMAGE" \
              bash -lc '
                set -euo pipefail
                glibc_version=$(ldd --version 2>&1)
                printf "%s\\n" "$glibc_version"
                case "$glibc_version" in
                  *"GNU libc) 2.17"*) ;;
                  *)
                    echo "ERROR: runtime environment is not GNU libc 2.17"
                    exit 1
                    ;;
                esac

                root=/verify/extracted/staging
                library="$root/lib/libmmap_chunker_core.so"
                test -f "$library"
                ldd "$library"

                work_dir=$(mktemp -d)
                trap "rm -rf \"$work_dir\"" EXIT
                fixture_dir="$work_dir/mmap-conformance-Δ"
                mkdir -p "$fixture_dir"
                cp /source/tests/conformance/corpus.jsonl "$fixture_dir/input.jsonl"
                gcc -std=c11 -Wall -Wextra -Werror \
                  -I"$root/include" /source/tests/conformance/c_consumer.c \
                  "$library" -Wl,-rpath,"$root/lib" -o "$work_dir/c_consumer"
                "$work_dir/c_consumer" "$fixture_dir/input.jsonl" \
                  /source/tests/conformance/expected.txt "$work_dir/result.txt"
                diff -u /source/tests/conformance/expected.txt "$work_dir/result.txt"
                echo "PASS: packaged artifact ran under GNU libc 2.17"
              '
          fi

          echo "=== Dynamic ABI symbol verification ==="
          grep -vE '^[[:space:]]*(#|$)' abi/v1.symbols | sort > "$VERIFY_ROOT/expected.symbols"
          case "${{ runner.os }}" in
            Linux)
              nm -D --defined-only "$DYNAMIC" \
                | awk '$3 ~ /^mmap_engine_/ {print $3}' | sort > "$VERIFY_ROOT/actual.symbols"
              ;;
            macOS)
              nm -gU "$DYNAMIC" \
                | awk '$3 ~ /^_?mmap_engine_/ {sub(/^_/, "", $3); print $3}' \
                | sort > "$VERIFY_ROOT/actual.symbols"
              ;;
            Windows)
              if command -v llvm-readobj.exe >/dev/null 2>&1; then
                llvm-readobj.exe --coff-exports "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v llvm-readobj >/dev/null 2>&1; then
                llvm-readobj --coff-exports "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v dumpbin.exe >/dev/null 2>&1; then
                dumpbin.exe /exports "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v llvm-nm.exe >/dev/null 2>&1; then
                llvm-nm.exe --defined-only "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              elif command -v llvm-nm >/dev/null 2>&1; then
                llvm-nm --defined-only "$DYNAMIC" \
                  | grep -oE 'mmap_engine_[A-Za-z0-9_]+' | sort > "$VERIFY_ROOT/actual.symbols"
              else
                echo "ERROR: no PE export inspection tool (llvm-readobj.exe, dumpbin.exe, or llvm-nm.exe)"
                exit 1
              fi
              ;;
          esac
          diff -u "$VERIFY_ROOT/expected.symbols" "$VERIFY_ROOT/actual.symbols"

          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "SKIP: native C and ctypes runtime checks for aarch64 artifact"
          else
            echo "=== C consumer from extracted archive ==="
            CONSUMER="$VERIFY_ROOT/c_consumer.c"
            sed 's|#include "../mmap_chunker.h"|#include "mmap_chunker.h"|' \
              examples/c_consumer.c > "$CONSUMER"
            test -s "$CONSUMER"
            case "${{ runner.os }}" in
              Windows)
                gcc -I"$ARCHIVE_ROOT/include" -o "$VERIFY_ROOT/c_consumer.exe" \
                  "$CONSUMER" "$ARCHIVE_ROOT/lib/mmap_chunker_core.dll.lib"
                (cd "$VERIFY_ROOT" && PATH="$ARCHIVE_ROOT/lib:$PATH" ./c_consumer.exe)
                ;;
              macOS)
                cc -I"$ARCHIVE_ROOT/include" -L"$ARCHIVE_ROOT/lib" \
                  -Wl,-rpath,"$ARCHIVE_ROOT/lib" -o "$VERIFY_ROOT/c_consumer" \
                  "$CONSUMER" -lmmap_chunker_core -lpthread
                (cd "$VERIFY_ROOT" && ./c_consumer)
                ;;
              Linux)
                cc -I"$ARCHIVE_ROOT/include" -L"$ARCHIVE_ROOT/lib" \
                  -Wl,-rpath,"$ARCHIVE_ROOT/lib" -o "$VERIFY_ROOT/c_consumer" \
                  "$CONSUMER" -lmmap_chunker_core -lpthread -ldl
                (cd "$VERIFY_ROOT" && ./c_consumer)
                ;;
            esac

            echo "=== Python ctypes from extracted dynamic library ==="
            if command -v python >/dev/null 2>&1; then
              PY_DYNAMIC="$DYNAMIC"
              if [ "${{ runner.os }}" = "Windows" ]; then
                PY_DYNAMIC="$(cygpath -w "$DYNAMIC")"
              fi
              python - "$PY_DYNAMIC" <<'PY'
          import ctypes
          import os
          import sys

          path = sys.argv[1]
          if os.name == "nt":
              os.add_dll_directory(os.path.dirname(os.path.abspath(path)))
          lib = ctypes.CDLL(path)
          lib.mmap_engine_abi_version.restype = ctypes.c_uint32
          lib.mmap_engine_capabilities.restype = ctypes.c_uint32
          assert lib.mmap_engine_abi_version() == 0x00010003
          assert lib.mmap_engine_capabilities() & 0x1
          print("PASS: ctypes loaded extracted dynamic library")
          PY
            else
              echo "SKIP: python is not installed on this runner"
            fi
          fi

          echo "=== Standalone CLI package ==="
          CLI_ARCHIVE="mmap-chunker-${RELEASE_VERSION}-${{ matrix.target }}"
          CLI_STAGING="cli-staging"
          rm -rf "$CLI_STAGING"
          mkdir -p "$CLI_STAGING"
          case "${{ runner.os }}" in
            Windows) CLI_BINARY_NAME="mmap-chunker.exe" ;;
            *) CLI_BINARY_NAME="mmap-chunker" ;;
          esac
          CLI_BINARY="target/${{ matrix.target }}/release/$CLI_BINARY_NAME"
          test -f "$CLI_BINARY"
          cp "$CLI_BINARY" "$CLI_STAGING/$CLI_BINARY_NAME"
          cp LICENSE-MIT LICENSE-APACHE "$CLI_STAGING/"
          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x "$CLI_STAGING/$CLI_BINARY_NAME"
          fi

          case "${{ runner.os }}" in
            Windows)
              (cd "$CLI_STAGING" && 7z a -tzip -mx=9 "../${CLI_ARCHIVE}.zip" \
                "$CLI_BINARY_NAME" LICENSE-MIT LICENSE-APACHE >/dev/null)
              sha256sum "${CLI_ARCHIVE}.zip" > "${CLI_ARCHIVE}.zip.sha256"
              CLI_CHECKSUM_FILE="${CLI_ARCHIVE}.zip.sha256"
              CLI_PACKAGE="${CLI_ARCHIVE}.zip"
              ;;
            macOS)
              tar czf "${CLI_ARCHIVE}.tar.gz" -C "$CLI_STAGING" \
                "$CLI_BINARY_NAME" LICENSE-MIT LICENSE-APACHE
              shasum -a 256 "${CLI_ARCHIVE}.tar.gz" > "${CLI_ARCHIVE}.tar.gz.sha256"
              CLI_CHECKSUM_FILE="${CLI_ARCHIVE}.tar.gz.sha256"
              CLI_PACKAGE="${CLI_ARCHIVE}.tar.gz"
              ;;
            Linux)
              tar czf "${CLI_ARCHIVE}.tar.gz" -C "$CLI_STAGING" \
                "$CLI_BINARY_NAME" LICENSE-MIT LICENSE-APACHE
              sha256sum "${CLI_ARCHIVE}.tar.gz" > "${CLI_ARCHIVE}.tar.gz.sha256"
              CLI_CHECKSUM_FILE="${CLI_ARCHIVE}.tar.gz.sha256"
              CLI_PACKAGE="${CLI_ARCHIVE}.tar.gz"
              ;;
          esac

          echo "=== CLI checksum verification ==="
          case "${{ runner.os }}" in
            macOS) shasum -a 256 -c "$CLI_CHECKSUM_FILE" ;;
            *) sha256sum -c "$CLI_CHECKSUM_FILE" ;;
          esac

          echo "=== Fresh CLI archive extraction ==="
          CLI_ARCHIVE_ROOT="$VERIFY_ROOT/cli-extracted"
          mkdir "$CLI_ARCHIVE_ROOT"
          case "${{ runner.os }}" in
            Windows) 7z x -y "$CLI_PACKAGE" "-o$CLI_ARCHIVE_ROOT" >/dev/null ;;
            *) tar xzf "$CLI_PACKAGE" -C "$CLI_ARCHIVE_ROOT" ;;
          esac
          test -f "$CLI_ARCHIVE_ROOT/$CLI_BINARY_NAME"
          test -f "$CLI_ARCHIVE_ROOT/LICENSE-MIT"
          test -f "$CLI_ARCHIVE_ROOT/LICENSE-APACHE"
          printf '%s\n' "$CLI_BINARY_NAME" LICENSE-MIT LICENSE-APACHE \
            | sort > "$VERIFY_ROOT/expected-cli-files"
          (
            cd "$CLI_ARCHIVE_ROOT"
            find . -type f -print | sed 's#^\./##' | sort
          ) > "$VERIFY_ROOT/actual-cli-files"
          diff -u "$VERIFY_ROOT/expected-cli-files" "$VERIFY_ROOT/actual-cli-files"

          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "SKIP: native CLI runtime checks for aarch64 artifact"
          else
            CLI_EXTRACTED="$CLI_ARCHIVE_ROOT/$CLI_BINARY_NAME"
            if [ "${{ runner.os }}" != "Windows" ]; then
              test -x "$CLI_EXTRACTED"
            fi
            test "$("$CLI_EXTRACTED" --version)" = "mmap-chunker $RELEASE_VERSION"
            "$CLI_EXTRACTED" --help >/dev/null
            CLI_FIXTURE="$VERIFY_ROOT/cli-fixture.bin"
            printf 'aa,bb,cc,dd' > "$CLI_FIXTURE"
            printf '0\t0\t6\t6\n1\t6\t11\t5\n' > "$VERIFY_ROOT/expected-cli-output"
            "$CLI_EXTRACTED" partition "$CLI_FIXTURE" --parts 2 --delimiter-byte 44 \
              > "$VERIFY_ROOT/actual-cli-output"
            diff -u "$VERIFY_ROOT/expected-cli-output" "$VERIFY_ROOT/actual-cli-output"
            echo "PASS: extracted CLI --version, --help, and partition smoke tests"
          fi

          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            CLI_GLIBC_VERSIONS=$(readelf --version-info "$CLI_ARCHIVE_ROOT/$CLI_BINARY_NAME" \
              | grep -oE 'GLIBC_[0-9.]+' | sort -Vu || true)
            printf '%s\n' "$CLI_GLIBC_VERSIONS"
            CLI_MAX_GLIBC=$(printf '%s\n' "$CLI_GLIBC_VERSIONS" | sort -V | tail -n 1)
            if [ -z "$CLI_MAX_GLIBC" ]; then
              echo "ERROR: extracted Linux CLI has no GLIBC version inventory"
              exit 1
            fi
            if ! awk -v found="$CLI_MAX_GLIBC" -v declared="GLIBC_2.17" '
              BEGIN {
                sub(/^GLIBC_/, "", found)
                sub(/^GLIBC_/, "", declared)
                split(found, f, ".")
                split(declared, d, ".")
                exit !(f[1] < d[1] || (f[1] == d[1] && f[2] <= d[2]))
              }
            '; then
              echo "ERROR: extracted Linux CLI requires $CLI_MAX_GLIBC, above GLIBC_2.17"
              exit 1
            fi
            echo "PASS: extracted Linux CLI is at or below GLIBC_2.17"

            echo "=== Extracted CLI GLIBC 2.17 runtime conformance ==="
            docker run --rm \
              -v "$VERIFY_ROOT:/verify:ro" \
              -e RELEASE_VERSION="$RELEASE_VERSION" \
              "$GLIBC_217_RUNTIME_IMAGE" \
              bash -lc '
                set -euo pipefail
                glibc_version=$(ldd --version 2>&1)
                printf "%s\\n" "$glibc_version"
                case "$glibc_version" in
                  *"GNU libc) 2.17"*) ;;
                  *)
                    echo "ERROR: runtime environment is not GNU libc 2.17"
                    exit 1
                    ;;
                esac

                cli=/verify/cli-extracted/mmap-chunker
                test -x "$cli"
                test "$("$cli" --version)" = "mmap-chunker $RELEASE_VERSION"
                "$cli" --help >/dev/null
                work_dir=$(mktemp -d)
                trap "rm -rf \"$work_dir\"" EXIT
                printf "aa,bb,cc,dd" > "$work_dir/cli-fixture.bin"
                printf "0\\t0\\t6\\t6\\n1\\t6\\t11\\t5\\n" > "$work_dir/expected-cli-output"
                "$cli" partition "$work_dir/cli-fixture.bin" --parts 2 --delimiter-byte 44 \
                  > "$work_dir/actual-cli-output"
                diff -u "$work_dir/expected-cli-output" "$work_dir/actual-cli-output"
                echo "PASS: extracted CLI ran under GNU libc 2.17"
              '
          fi

          echo "=== Archive contents ==="
          case "${{ runner.os }}" in
            Windows) 7z l "$PACKAGE" ;;
            *) tar tzf "$PACKAGE" ;;
          esac
          echo "=== CLI archive contents ==="
          case "${{ runner.os }}" in
            Windows) 7z l "$CLI_PACKAGE" ;;
            *) tar tzf "$CLI_PACKAGE" ;;
          esac
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "PASS: $PACKAGE has verified checksum, contents, ABI, and package-only aarch64 coverage"
            echo "PASS: $CLI_PACKAGE has verified checksum, contents, and package-only aarch64 coverage"
          else
            echo "PASS: $PACKAGE has verified checksum, contents, ABI, C, and ctypes coverage"
            echo "PASS: $CLI_PACKAGE has verified checksum, contents, and runtime smoke coverage"
          fi

      - name: Upload verified artifact for release or dry run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            mmap-chunker-core-*.tar.gz
            mmap-chunker-core-*.zip
            mmap-chunker-core-*.sha256
            mmap-chunker-[0-9]*.tar.gz
            mmap-chunker-[0-9]*.zip
            mmap-chunker-[0-9]*.sha256
          if-no-files-found: error
          retention-days: 7

  wheel-build:
    # Build + verify the Python wheel matrix and sdist through the reusable
    # workflow so the target matrix exists in exactly one place. This workflow
    # never publishes; publication happens in publish-pypi below.
    needs: [prepare]
    uses: ./.github/workflows/python-wheel.yml

  publish-crate:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [prepare, build-release, wheel-build]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Obtain temporary crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git describe --exact-match --tags HEAD)" = "v${{ needs.prepare.outputs.version }}"
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$CARGO_VERSION" = "${{ needs.prepare.outputs.version }}"
          cargo package
          cargo publish --dry-run

      - name: Publish crate to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  publish-pypi:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [prepare, build-release, wheel-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # download-artifact `pattern` accepts a single glob; a newline-separated
      # list is treated as one literal pattern and matches nothing. Download the
      # wheel set and the sdist in separate steps into the shared `dist` dir.
      - name: Download verified wheel artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download verified sdist artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-sdist
          path: dist
          merge-multiple: true

      - name: Assert exact distribution inventory
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/assert-pypi-distributions.sh dist "${{ needs.prepare.outputs.version }}"

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  publish-release:
    # GitHub Release creation is the final step: it depends on both publisher
    # jobs, so a failure in either registry blocks the draft release.
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [prepare, build-release, wheel-build, publish-pypi, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Assert release artifact set is present
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 20
          test "$(find dist -maxdepth 1 -type f -name 'mmap-chunker-core-*' | wc -l)" -eq 10
          test "$(find dist -maxdepth 1 -type f -name 'mmap-chunker-[0-9]*' | wc -l)" -eq 10

      - name: Create draft release and upload artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          name: "v${{ needs.prepare.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## mmap-chunker-core v${{ needs.prepare.outputs.version }}

            Prebuilt native libraries for C, Python, Go, and other FFI consumers,
            plus standalone `mmap-chunker` CLI archives.

            Native archives contain the C header, dynamic library, static library, and licenses.
            CLI archives contain the versioned `mmap-chunker` executable and licenses.
            Every archive has an accompanying `.sha256` checksum file.

            Python wheels and the sdist for this version are published on PyPI
            (project `mmap-chunker-core`), not duplicated here.
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
