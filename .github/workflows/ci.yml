name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_TOOLCHAIN: nightly-2026-08-10
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      ASAN_RUST_TARGET_DIR: target/asan-rust
      ASAN_MIXED_TARGET_DIR: target/asan-mixed
      CC: clang
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned ASan toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.ASAN_TOOLCHAIN }}
          components: rust-src

      - name: Prove Rust ASan instrumentation is active
        shell: bash
        run: |
          set -euo pipefail
          control_dir=$(mktemp -d)
          trap 'rm -rf "$control_dir"' EXIT
          mkdir "$control_dir/src"
          printf '%s\n' '[package]' 'name = "asan-negative-control"' 'version = "0.0.0"' 'edition = "2021"' > "$control_dir/Cargo.toml"
          printf '%s\n' 'fn main() {' '    let xs = [0, 1, 2, 3];' '    let _y = unsafe { *xs.as_ptr().offset(4) };' '}' > "$control_dir/src/main.rs"
          set +e
          RUSTFLAGS="-Zsanitizer=address" CARGO_TARGET_DIR="$ASAN_RUST_TARGET_DIR" cargo +"$ASAN_TOOLCHAIN" run --manifest-path "$control_dir/Cargo.toml" -Zbuild-std --target x86_64-unknown-linux-gnu > "$control_dir/output" 2>&1
          status=$?
          set -e
          cat "$control_dir/output"
          test "$status" -ne 0
          grep -F 'ERROR: AddressSanitizer' "$control_dir/output"

      - name: Run focused mmap and FFI tests under ASan
        run: |
          RUSTFLAGS="-Zsanitizer=address" CARGO_TARGET_DIR="${{ env.ASAN_RUST_TARGET_DIR }}" cargo +${{ env.ASAN_TOOLCHAIN }} test --lib mmap::tests -Zbuild-std --target x86_64-unknown-linux-gnu
          RUSTFLAGS="-Zsanitizer=address" CARGO_TARGET_DIR="${{ env.ASAN_RUST_TARGET_DIR }}" cargo +${{ env.ASAN_TOOLCHAIN }} test --lib ffi::tests -Zbuild-std --target x86_64-unknown-linux-gnu
          RUSTFLAGS="-Zsanitizer=address" CARGO_TARGET_DIR="${{ env.ASAN_RUST_TARGET_DIR }}" cargo +${{ env.ASAN_TOOLCHAIN }} test --test c_abi_test -Zbuild-std --target x86_64-unknown-linux-gnu

      - name: Run native C consumer against ASan Rust staticlib
        run: |
          RUSTFLAGS="-Zsanitizer=address -Zexternal-clangrt" CARGO_TARGET_DIR="${{ env.ASAN_MIXED_TARGET_DIR }}" cargo +${{ env.ASAN_TOOLCHAIN }} build --release -Zbuild-std --target x86_64-unknown-linux-gnu
          clang -fsanitize=address -fno-omit-frame-pointer -o /tmp/mmap_chunker_asan_c_consumer examples/c_consumer.c target/asan-mixed/x86_64-unknown-linux-gnu/release/libmmap_chunker_core.a -lpthread -ldl
          /tmp/mmap_chunker_asan_c_consumer

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Python C-ABI semantic parity
        run: python3 tests/python_parity.py

      - name: Build and run C consumer
        run: |
          cc -o /tmp/mmap_chunker_c_consumer examples/c_consumer.c target/release/libmmap_chunker_core.a -lpthread -ldl
          /tmp/mmap_chunker_c_consumer

      - name: Verify ABI v1 symbols (Linux cdylib)
        run: |
          nm -D --defined-only target/release/libmmap_chunker_core.so \
            | awk '$3 ~ /^mmap_engine_/ {print $3}' \
            | sort > /tmp/actual.symbols
          grep -vE '^[[:space:]]*(#|$)' abi/v1.symbols | sort > /tmp/expected.symbols
          echo "=== ABI v1 symbol check ==="
          echo "Expected:"
          cat /tmp/expected.symbols
          echo "Exported:"
          cat /tmp/actual.symbols
          diff -u /tmp/expected.symbols /tmp/actual.symbols
          echo "PASS: exported mmap_engine_* symbols exactly match abi/v1.symbols"

      - name: Verify Cargo package contract
        run: |
          set -euo pipefail
          cargo package
          package=$(find target/package -maxdepth 1 -name '*.crate' -print -quit)
          test -n "$package"
          tar tf "$package" | sed 's|^[^/]*/||' | sort > /tmp/package.files
          echo "=== Cargo package contents ==="
          cat /tmp/package.files

          for path in Cargo.toml README.md LICENSE-MIT LICENSE-APACHE mmap_chunker.h abi/v1.symbols examples/c_consumer.c src/lib.rs; do
            if ! grep -qFx "$path" /tmp/package.files; then
              echo "FAIL: required package file '$path' is missing"
              exit 1
            fi
          done

          if grep -nE '(^|/)(\.env[^/]*|\.agents|\.codex|AGENTS\.md|AGENT_LOG\.md|native_io|target|\.vscode|\.idea|__pycache__)(/|$)|(^|/)[^/]*\.(pyc|pyo|db|sqlite|sqlite3)$|(^|/)fuzz/(artifacts|target|crashers|work|tmp)(/|$)' /tmp/package.files; then
            echo "FAIL: private, local, or generated file found in Cargo package"
            exit 1
          fi
          echo "PASS: Cargo package contains required distribution files and no forbidden local artifacts"

  abi-consumers-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.6'

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.416'

      - name: Print conformance tool versions
        run: |
          rustc --version
          cargo --version
          go version
          dotnet --version
          python3 --version
          cc --version | head -n 1
          test "$(go env CGO_ENABLED)" = "1"

      - name: Build authoritative Linux native library
        run: cargo build --release

      - name: Run C, Python, Go/cgo, and C# consumers against one library
        shell: bash
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT
          fixture_dir="$work_dir/mmap-conformance-Δ"
          mkdir -p "$fixture_dir" "$work_dir/results"
          cp tests/conformance/corpus.jsonl "$fixture_dir/input.jsonl"

          fixture="$fixture_dir/input.jsonl"
          expected="$GITHUB_WORKSPACE/tests/conformance/expected.txt"
          library="$GITHUB_WORKSPACE/target/release/libmmap_chunker_core.so"
          library_dir=$(dirname "$library")

          cc -std=c11 -Wall -Wextra -Werror -I"$GITHUB_WORKSPACE" \
            tests/conformance/c_consumer.c "$library" \
            -Wl,-rpath,"$library_dir" -o "$work_dir/c_consumer"
          "$work_dir/c_consumer" "$fixture" "$expected" "$work_dir/results/c"

          python3 tests/conformance/python_consumer.py \
            --library "$library" --fixture "$fixture" --expected "$expected" \
            --output "$work_dir/results/python"

          GO111MODULE=off \
          CGO_ENABLED=1 \
          CGO_CFLAGS="-I$GITHUB_WORKSPACE" \
          CGO_LDFLAGS="$library -Wl,-rpath,$library_dir" \
            go build -o "$work_dir/go_consumer" ./tests/conformance/go
          "$work_dir/go_consumer" --library "$library" --fixture "$fixture" \
            --expected "$expected" --output "$work_dir/results/go"

          dotnet build tests/conformance/csharp/Conformance.csproj \
            --configuration Release --nologo
          dotnet tests/conformance/csharp/bin/Release/net8.0/Conformance.dll \
            --library "$library" --fixture "$fixture" --expected "$expected" \
            --output "$work_dir/results/csharp"

          cmp "$work_dir/results/c" "$work_dir/results/python"
          cmp "$work_dir/results/c" "$work_dir/results/go"
          cmp "$work_dir/results/c" "$work_dir/results/csharp"
          echo "=== canonical cross-language result ==="
          cat "$work_dir/results/c"
          echo "PASS: all four consumers agree on the source-head Linux ABI result"

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Build and run C consumer
        run: |
          cc -o c_consumer examples/c_consumer.c target/release/libmmap_chunker_core.a -lpthread
          ./c_consumer

  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Check semver against latest crates.io baseline
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          release-type: minor

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.77
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.77"

      - name: cargo check (MSRV 1.77)
        run: cargo check

      - name: cargo test (MSRV 1.77)
        run: cargo test
