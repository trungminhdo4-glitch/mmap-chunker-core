name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Build and run C consumer
        run: |
          cc -o c_consumer examples/c_consumer.c target/release/libmmap_chunker_core.a -lpthread -ldl
          ./c_consumer

      - name: Verify ABI v1 symbols (Linux cdylib)
        run: |
          nm -D target/release/libmmap_chunker_core.so | grep -oP 'T \Kmmap_engine_\w+' | sort > /tmp/actual.symbols
          grep '^mmap_engine_' abi/v1.symbols | sort > /tmp/expected.symbols
          echo "=== ABI v1 symbol check ==="
          echo "Required:"
          cat /tmp/expected.symbols
          echo "Exported:"
          cat /tmp/actual.symbols
          for sym in $(grep '^mmap_engine_' abi/v1.symbols); do
            if ! grep -qFx "$sym" /tmp/actual.symbols; then
              echo "FAIL: required symbol '$sym' not exported"
              exit 1
            fi
          done
          echo "PASS: all required v1 symbols present"

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Build and run C consumer
        run: |
          cc -o c_consumer examples/c_consumer.c target/release/libmmap_chunker_core.a -lpthread
          ./c_consumer

  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Check semver against latest crates.io baseline
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          release-type: minor

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.77
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.77"

      - name: cargo check (MSRV 1.77)
        run: cargo check

      - name: cargo test (MSRV 1.77)
        run: cargo test
