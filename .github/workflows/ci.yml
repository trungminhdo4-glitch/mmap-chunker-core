name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Python C-ABI semantic parity
        run: python3 tests/python_parity.py

      - name: Build and run C consumer
        run: |
          cc -o /tmp/mmap_chunker_c_consumer examples/c_consumer.c target/release/libmmap_chunker_core.a -lpthread -ldl
          /tmp/mmap_chunker_c_consumer

      - name: Verify ABI v1 symbols (Linux cdylib)
        run: |
          nm -D --defined-only target/release/libmmap_chunker_core.so \
            | awk '$3 ~ /^mmap_engine_/ {print $3}' \
            | sort > /tmp/actual.symbols
          grep -vE '^[[:space:]]*(#|$)' abi/v1.symbols | sort > /tmp/expected.symbols
          echo "=== ABI v1 symbol check ==="
          echo "Expected:"
          cat /tmp/expected.symbols
          echo "Exported:"
          cat /tmp/actual.symbols
          diff -u /tmp/expected.symbols /tmp/actual.symbols
          echo "PASS: exported mmap_engine_* symbols exactly match abi/v1.symbols"

      - name: Verify Cargo package contract
        run: |
          set -euo pipefail
          cargo package
          package=$(find target/package -maxdepth 1 -name '*.crate' -print -quit)
          test -n "$package"
          tar tf "$package" | sed 's|^[^/]*/||' | sort > /tmp/package.files
          echo "=== Cargo package contents ==="
          cat /tmp/package.files

          for path in Cargo.toml README.md LICENSE-MIT LICENSE-APACHE mmap_chunker.h abi/v1.symbols examples/c_consumer.c src/lib.rs; do
            if ! grep -qFx "$path" /tmp/package.files; then
              echo "FAIL: required package file '$path' is missing"
              exit 1
            fi
          done

          if grep -nE '(^|/)(\.env[^/]*|\.agents|\.codex|AGENTS\.md|AGENT_LOG\.md|native_io|target|\.vscode|\.idea|__pycache__)(/|$)|(^|/)[^/]*\.(pyc|pyo|db|sqlite|sqlite3)$|(^|/)fuzz/(artifacts|target|crashers|work|tmp)(/|$)' /tmp/package.files; then
            echo "FAIL: private, local, or generated file found in Cargo package"
            exit 1
          fi
          echo "PASS: Cargo package contains required distribution files and no forbidden local artifacts"

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Build and run C consumer
        run: |
          cc -o c_consumer examples/c_consumer.c target/release/libmmap_chunker_core.a -lpthread
          ./c_consumer

  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Check semver against latest crates.io baseline
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          release-type: minor

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.77
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.77"

      - name: cargo check (MSRV 1.77)
        run: cargo check

      - name: cargo test (MSRV 1.77)
        run: cargo test
