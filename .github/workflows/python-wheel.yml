name: Python Wheel

# Bounded wheel build + proof CI. Builds one py3-none-<platform> wheel per
# supported target (matching the native release matrix), verifies the ABI
# symbols, GLIBC ceiling on Linux, wheel contents, and runs clean-environment
# install proofs. Wheels are uploaded as Actions artifacts only; nothing is
# published to PyPI or GitHub Releases.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  wheel-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            plat: manylinux_2_17_x86_64
            cross: 0
            versions: "3.10 3.12 3.14"
            datatrove: 1
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            plat: manylinux_2_17_aarch64
            cross: 1
            versions: ""
            datatrove: 0
          - os: macos-15-intel
            target: x86_64-apple-darwin
            plat: ""
            cross: 0
            versions: ""
            datatrove: 0
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: ""
            cross: 0
            versions: ""
            datatrove: 0
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            plat: win_amd64
            cross: 0
            versions: "3.12"
            datatrove: 0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python build tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet build wheel setuptools

      - name: Install Rust toolchain
        if: ${{ !matrix.cross }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross CLI
        if: ${{ matrix.cross }}
        run: cargo install cross --version 0.2.5 --locked

      - name: Build and verify wheel
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WHEEL_PLAT_TAG: ${{ matrix.plat }}
          CROSS: ${{ matrix.cross }}
        run: bash scripts/build-python-wheel.sh

      - name: Fresh venv install + installed-wheel proof
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/python python/scripts/wheel_proof.py

      - name: Same wheel across Python versions
        if: ${{ matrix.versions != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for version in ${{ matrix.versions }}; do
            echo "=== Python $version ==="
            python$version -m venv "/tmp/wheel-venv-$version"
            "/tmp/wheel-venv-$version/bin/python" -m pip install --quiet --upgrade pip
            "/tmp/wheel-venv-$version/bin/python" -m pip install --quiet dist/*.whl
            "/tmp/wheel-venv-$version/bin/python" python/scripts/wheel_proof.py
          done

      - name: DataTrove packaged integration smoke
        if: ${{ matrix.datatrove == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/dt-venv
          /tmp/dt-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/dt-venv/bin/python -m pip install --quiet "dist/*.whl[datatrove]"
          /tmp/dt-venv/bin/python -m pytest python/tests/test_datatrove_integration.py -q

      - name: Upload wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7