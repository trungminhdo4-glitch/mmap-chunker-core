[package]
name = "mmap-chunker-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mmap-chunker-core = { path = ".." }

[[bin]]
name = "scanner_differential"
